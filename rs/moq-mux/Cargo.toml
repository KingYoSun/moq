[package]
name = "moq-mux"
description = "Media muxers and demuxers for MoQ"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.10.12"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[dependencies]
# The published hang and moq crates (the same versions as the workspace), so a git dependency on this crate
# shares them with crates.io dependents (kukuri pins this commit with [patch.crates-io]).
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
crc = "3"
h264-parser = { version = "0.4.2" }
hang = "0.21.12"
kio = "0.6.2"
memchr = "2"
moq-binary = "0.1.11"
moq-json = "0.5.9"
moq-loc = "0.2.20"
moq-msf = "0.5.1"
moq-net = "0.3.11"
mp4-atom = { version = "0.15", features = ["tokio", "bytes", "serde"] }
mpeg2ts = "0.6.0"
num_enum = { workspace = true }
scuffle-av1 = { version = "0.1.4" }
scuffle-h265 = { version = "0.2.2" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
url = { workspace = true }
web-async = { workspace = true }
# The browser (wasm) has no std clock: Instant and SystemTime come from web-time there (std on native).
web-time = "1.1"
webm-iterable = "0.7"

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }
